version: '3.8'

services:
  ntp:
    image: ghcr.io/fonlan/ntp:latest
    container_name: ntp
    ports:
      - "8080:8080"
    volumes:
      - ./data:/root/data
    restart: unless-stopped
    environment:
      - PORT=8080
      # 认证配置（可选）
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=your_password_here
      # - SESSION_SECRET=your_random_secret_here
      # - SESSION_TTL=365d
    # 如果不设置 AUTH_USERNAME 和 AUTH_PASSWORD，认证将被禁用（公开访问）
