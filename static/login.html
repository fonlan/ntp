<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Login - NTP</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/login.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="/static/logo.svg" alt="NTP Logo" class="login-logo">
                <h1 id="loginHeaderTitle">NTP - Bookmark Navigation</h1>
                <p id="loginSubtitle">Please login to continue</p>
            </div>
            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username" id="usernameLabel">Username</label>
                    <input type="text" id="username" name="ntp_user" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
                </div>
                <div class="form-group">
                    <label for="password" id="passwordLabel">Password</label>
                    <input type="text" id="password" class="password-mask" name="ntp_pass" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
                </div>
                <div id="loginError" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span id="loginBtnText">Login</span>
                </button>
            </form>
            <div class="login-footer">
                <label for="languageSelect" class="sr-only" id="languageLabel">Language</label>
                <select id="languageSelect" class="language-select">
                    <option value="en">English</option>
                    <option value="zh">简体中文</option>
                </select>
            </div>
        </div>
    </div>
    <script src="/static/login.js"></script>
</body>

</html>
